name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gnupg jq python3 python3-tomlkit python3-yaml shellcheck

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22

      - name: Install current agent runtimes
        run: npm install --global @openai/codex@latest @anthropic-ai/claude-code@latest

      - name: Run CI pipeline
        env:
          POWER_AGENTS_REQUIRE_AGENT_RUNTIMES: 1
        run: make ci
